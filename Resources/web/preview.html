<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="preview.css">
<script src="katex/katex.min.js"></script>
<script src="latexkit.js"></script>
</head>
<body>
<main id="content"></main>
<script>
(function () {
  "use strict";
  var content = document.getElementById("content");
  var lastHeight = -1;

  function report() {
    var height = Math.ceil(content.getBoundingClientRect().height);
    var handlers = window.webkit && window.webkit.messageHandlers;
    if (height !== lastHeight && handlers && handlers.size) {
      lastHeight = height;
      handlers.size.postMessage(height);
    }
  }

  var fitWidth = false;

  // With fitWidth, scales wide displays and tables down (to at most 45%) instead of scrolling them sideways.
  function fit() {
    content.style.zoom = "";
    if (!fitWidth) return;
    // Either an inner scroller overflows, or the content spills past the page itself.
    var overflow = Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth);
    content.querySelectorAll(".tx-display, .tx-table-wrap, table").forEach(function (el) {
      overflow = Math.max(overflow, el.scrollWidth - el.clientWidth,
                          el.getBoundingClientRect().right - document.documentElement.clientWidth);
    });
    if (overflow > 0) {
      var width = content.clientWidth;
      content.style.zoom = String(Math.max(0.45, width / (width + overflow + 4)));
    }
    report();
  }

  // Called by the app with {kind, latex, background?, fitWidth?}.
  window.texsnapRender = function (payload) {
    content.className = "kind-" + payload.kind;
    content.innerHTML = LatexKit.preview(payload.kind, payload.latex);
    if (payload.background) document.body.style.background = payload.background;
    fitWidth = !!payload.fitWidth;
    requestAnimationFrame(function () { fit(); report(); });
  };

  // Renders, waits for the KaTeX fonts, and returns the content height (used for snapshots).
  // Timers rather than animation frames: frames never fire in a window that is not on screen.
  window.texsnapRenderAndMeasure = async function (payload) {
    window.texsnapRender(payload);
    await document.fonts.ready;
    await new Promise(function (resolve) { setTimeout(resolve, 50); });
    return Math.ceil(content.getBoundingClientRect().height);
  };

  new ResizeObserver(report).observe(content);
  document.fonts.ready.then(function () { fit(); report(); });
})();
</script>
</body>
</html>
